spring:
  application:
    name: doc-rag-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: 8080

docrag:
  # 相对路径以进程工作目录（backend/）为基准，指向仓库根的 data/
  upload-dir: ../data/upload
  index-dir: ../data/index
  table-index-dir: ../data/index-table
  vector-service-url: http://127.0.0.1:8081
  llm:
    # OpenAI 兼容接口；api-key 未配置时 /api/ask 返回 400（检索功能不受影响）
    base-url: ${DOCRAG_LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${DOCRAG_LLM_API_KEY:}
    model: ${DOCRAG_LLM_MODEL:gpt-4o-mini}
    temperature: 0.2
    timeout-seconds: 60
    max-context-chunks: 8
    context-char-budget: 6000
