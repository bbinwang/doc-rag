spring:
  application:
    name: doc-rag-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: 8080

docrag:
  # 相对路径以进程工作目录（backend/）为基准，指向仓库根的 data/
  upload-dir: ../data/upload
  plain-index-dir: ../data/index-plain
  deep-index-dir: ../data/index-deep
  vector-service-url: http://127.0.0.1:8081
  llm:
    # 多 provider：active 选出唯一启用的 provider，其余仅存配置不生效（切换改 active 或 DOCRAG_LLM_ACTIVE）
    active: ${DOCRAG_LLM_ACTIVE:glm}
    providers:
      glm:
        # 智谱 GLM（OpenAI 兼容端点，与 Claude Code 的 GLM 配置同 token）
        base-url: ${DOCRAG_LLM_GLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        api-key: ${DOCRAG_LLM_GLM_API_KEY:b4df6f4bcaf84015896e3fd9f3fdb3c6.1noP5G0M87MuiPBj}
        model: ${DOCRAG_LLM_GLM_MODEL:glm-5.3}
        temperature: 0.2
        timeout-seconds: 120
      mac-uni:
        # 原内网 LLM 服务（保留配置不启用；切回设 DOCRAG_LLM_ACTIVE=mac-uni）
        base-url: ${DOCRAG_LLM_MACUNI_BASE_URL:http://192.168.2.122:3000/v1}
        api-key: ${DOCRAG_LLM_MACUNI_API_KEY:sk-S23ssEGQap8cE4WDUqaXQn5orhvxzUNJ2ZY9YqRTOSdHXvbl}
        model: ${DOCRAG_LLM_MACUNI_MODEL:mac-uni-model}
        temperature: 0.2
        timeout-seconds: 60
  ask:
    # 问答检索三参数（前端问答页可按次覆盖，后端统一钳制 [1, 20]）
    bm25-chunks: 5        # 倒排（BM25）路最大检索 chunk 个数
    vector-chunks: 5      # 向量路最大检索 chunk 个数
    context-chunks: 8     # 重排后最大送给 LLM 问答的 chunk 个数（每模式独立）
    context-char-budget: 6000  # 每模式上下文总字符预算（不开放请求覆盖）
